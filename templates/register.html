<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TechCorp Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066FF; --primary-dark: #0052CC;
            --secondary: #00CCFF; --bg: #0A0E1A;
            --surface: #141824; --surface-2: #1C2130;
            --text: #FFFFFF; --text-2: #A0A7B8;
            --text-3: #6B7280; --border: #2A3142;
            --success: #00D67B;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0,102,255,.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,204,255,.1) 0%, transparent 50%);
        }
        .container {
            position: relative; z-index: 1;
            width: 100%; max-width: 500px; padding: 24px;
            animation: fadeUp .6s ease-out;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .header { text-align: center; margin-bottom: 24px; }
        .company-name {
            font-size: 28px; font-weight: 600; margin-bottom: 4px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .tagline { color: var(--text-2); font-size: 13px; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 32px;
            position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        .card-title { font-size: 20px; font-weight: 600; margin-bottom: 5px; }
        .card-sub { color: var(--text-2); font-size: 13px; margin-bottom: 22px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        .input-wrap { position: relative; }
        .input-wrap svg {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%); color: var(--text-3); pointer-events: none;
        }
        input {
            width: 100%; padding: 11px 13px 11px 40px;
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 10px; font-size: 14px; color: var(--text);
            font-family: inherit; transition: all .25s;
        }
        input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,102,255,.1);
        }
        input::placeholder { color: var(--text-3); }
        .btn-register {
            width: 100%; padding: 13px; margin-top: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; border-radius: 10px;
            color: white; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all .3s;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,102,255,.35);
        }
        .login-link {
            text-align: center; margin-top: 18px;
            color: var(--text-2); font-size: 14px;
        }
        .login-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .footer { text-align: center; margin-top: 20px; color: var(--text-3); font-size: 12px; }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <div class="header">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" style="margin-bottom:12px">
                <rect width="48" height="48" rx="12" fill="url(#g1)"/>
                <path d="M24 14L34 20V28L24 34L14 28V20L24 14Z" fill="white" opacity=".9"/>
                <path d="M24 20L29 23V27L24 30L19 27V23L24 20Z" fill="white" opacity=".55"/>
                <defs>
                    <linearGradient id="g1" x1="0" y1="0" x2="48" y2="48">
                        <stop offset="0%" stop-color="#0066FF"/>
                        <stop offset="100%" stop-color="#00CCFF"/>
                    </linearGradient>
                </defs>
            </svg>
            <h1 class="company-name">HoneyPot</h1>
            <p class="tagline">Create your enterprise account</p>
        </div>

        <div class="card">
            <h2 class="card-title">Create Account</h2>
            <p class="card-sub">Fill in your details to register</p>

            <form method="POST" action="/register">

                <div class="row2">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-wrap">
                            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path d="M10 10a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 1114 0H3z"/></svg>
                            <input type="text" name="name" placeholder="Your full name" required autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <div class="input-wrap">
                            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path d="M10 10a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 1114 0H3z"/></svg>
                            <input type="text" name="username" placeholder="Choose username" required autocomplete="off">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
                        <input type="email" name="email" placeholder="you@company.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrap">
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/></svg>
                        <input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" required>
                    </div>
                </div>

                <div class="row2">
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrap">
                            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/></svg>
                            <input type="password" name="password" placeholder="Create password" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="input-wrap">
                            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/></svg>
                            <input type="password" name="confirm_password" placeholder="Confirm password" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="/">Sign in here</a>
            </div>
        </div>
        <div class="footer">© 2026 TechCorp Inc. All rights reserved.</div>
    </div>
</body>
</html>
