<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Honeypot Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #0f172a; color: white;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .box {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 16px; padding: 40px 36px;
            width: 100%; max-width: 420px;
            box-shadow: 0 24px 60px rgba(0,0,0,.4);
        }
        .icon { font-size: 36px; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
        .sub { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 7px; color: #cbd5e1; }
        input {
            width: 100%; padding: 12px 14px;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 8px; color: white; font-size: 14px;
            font-family: inherit; margin-bottom: 18px; transition: border .2s;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        button {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none; border-radius: 8px; color: white;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all .2s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59,130,246,.4); }
        .error {
            background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
            color: #fca5a5; padding: 10px 14px; border-radius: 8px;
            font-size: 13px; margin-bottom: 18px;
        }
        .note { text-align: center; color: #475569; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🛡️</div>
        <h1>Admin Panel</h1>
        <p class="sub">LOG IN TO YOUR ACCOUNT</p>
        {% if error %}
        <div class="error">⚠ {{ error }}</div>
        {% endif %}
        <form method="POST" action="/admin/login">
            <label>Username / email</label>
            <input type="text" name="username" placeholder="Username / email" required autocomplete="off">
            <label>Password</label>
            <input type="password" name="password" placeholder="enter correct password" required>
            <button type="submit">LOG IN</button>
        </form>
        <p class="note">Restricted access — authorised personnel only</p>
    </div>
</body>
</html>
