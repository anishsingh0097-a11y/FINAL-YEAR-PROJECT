<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #0A0E1A; color: white;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .box { text-align: center; max-width: 480px; padding: 24px; }
        h1 {
            font-size: 120px; font-weight: 700; line-height: 1;
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        h2 { font-size: 28px; margin-bottom: 12px; }
        p { color: #64748b; margin-bottom: 32px; line-height: 1.6; }
        a {
            display: inline-block; padding: 12px 32px;
            background: #3b82f6; color: white; text-decoration: none;
            border-radius: 10px; font-weight: 500; transition: all .2s;
        }
        a:hover { background: #2563eb; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <a href="/">Go Home</a>
    </div>
</body>
</html>
